decision_version: "v2.1"
dataset_name: "flight_with_weather.csv"
dataset_version: "v1.0"

# ---------------------------------------------------------------------
# EXPECTED FINAL DATASET (REGRESSION CHECK)
# ---------------------------------------------------------------------
expected_final_dataset:
  rows: 249011
  flights: 194
  columns: 38
  missing_cells: 0
  exact_duplicates: 0
  flight_time_duplicates: 0

validation:
  enforce_expected_shape: true

# ---------------------------------------------------------------------
# FLIGHT HANDLING
# ---------------------------------------------------------------------
flight_handling:
  remove:
    - flight: 211
      reason: "Static candidate; low altitude/speed; 100% weather missing"

    - flight: 212
