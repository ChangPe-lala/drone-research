# ---------------------------------------------------------------------
# DUPLICATE HANDLING
# ---------------------------------------------------------------------
duplicate_handling:
  exact_duplicates:
    action: "remove"

  flight_time_duplicates:
    action: "keep"

# ---------------------------------------------------------------------
# MISSING VALUE POLICIES
# ---------------------------------------------------------------------
missing_handling:
  affected_flights:
    action: "remove_flight"

  remaining_missing:
    action: "error"

# ---------------------------------------------------------------------
# OUTLIER POLICIES
# ---------------------------------------------------------------------
outlier_handling:
  battery_voltage:
    action: "keep"
    reason: "Physically valid"

  battery_current:
    action: "keep"
    reason: "Physically plausible"

  altitude:
    action: "keep"
    reason: "Physically plausible"

  wind_gust_ms:
    action: "keep"
    reason: "Statistical outlier but physically valid"

  temperature_c:
    action: "keep"
    reason: "Statistically suspicious but physically valid"

# ---------------------------------------------------------------------
# LEAKAGE AUDIT LEVEL 2 (STEP 6)
# ---------------------------------------------------------------------
leakage_audit:
  forbidden_columns:
    - "energy_efficiency"
    - "energy_consumed_wh"

  target_derived_columns:
    - "energy_consumed_wh"

  allowed_operational_features:
    - "battery_voltage"
    - "battery_current"
    - "time"