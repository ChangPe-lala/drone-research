architecture: PLATFORM_AWARE

target: energy_efficiency

rationale: >
  ExtraTrees with the PLATFORM_AWARE architecture was selected based on
  the complete D07-D12 evidence. It achieved the lowest overall
  Evidence_Rank_Sum (9.0) and the best combined Macro WMAPE among the
  evaluated universal/platform-aware candidates (0.092195), improving
  over Universal ExtraTrees (0.121904). Cross-platform direct transfer
  remained poor for all models, while explicit platform identity
  improved heterogeneous Multi-UAV prediction. Direct EE is retained
  as the primary target based on the overall D09 target-strategy evidence.

